repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.13
    hooks:
      - id: uv-lock

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore, DL3008]  

  - repo: https://github.com/adrienverge/yamllint # docker-compose linting
    rev: v1.37.1
    hooks:
      - id: yamllint
        files: docker-compose.*\.ya?ml$
        
  - repo: https://github.com/kynan/nbstripout # strips jupyter notebook outputs
    rev: 0.8.1
    hooks:
      - id: nbstripout