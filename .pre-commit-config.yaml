repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3  # Use the latest stable version
    hooks:
      - id: ruff
        args: [--fix]  # Auto-fix issues where possible
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.20      # Use the latest stable version
    hooks:
      - id: uv-lock   # Ensures uv.lock is updated if pyproject.toml changes
  - repo: https://github.com/hadolint/hadolint # Dockerfile linting
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/adrienverge/yamllint # docker-compose linting
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: docker-compose.*\.ya?ml$
  - repo: https://github.com/kynan/nbstripout # strips jupyter notebook outputs
    rev: 0.7.1
    hooks:
      - id: nbstripout